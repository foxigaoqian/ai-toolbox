name: Verify Worker
on:
  push:
  pull_request:
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check.mjs
      - run: node --test tests/ux-smoke.test.mjs
