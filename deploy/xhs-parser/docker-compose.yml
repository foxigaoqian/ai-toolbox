services:
  parser:
    image: ghcr.io/joeanamier/xhs-downloader:latest
    command: ["python", "main.py", "api"]
    expose:
      - "5556"
    volumes:
      - xhs_parser_data:/app/Volume
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      PARSER_TOKEN: ${PARSER_TOKEN:?set PARSER_TOKEN in .env}
      UPSTREAM_URL: http://parser:5556/xhs/detail
      PORT: "8788"
    depends_on:
      - parser
    ports:
      - "127.0.0.1:8788:8788"
    restart: unless-stopped

volumes:
  xhs_parser_data:
